<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100b1d"><title>LamMOD Link — Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#3b2057,transparent 48%),#100b1d;color:#f7f2ff;font:15px system-ui}main{width:min(92%,720px);margin:48px auto}.panel{background:#1b1426;border:1px solid #ffffff20;border-radius:22px;padding:24px;box-shadow:0 20px 60px #0006}.brand{font-size:13px;letter-spacing:.22em;color:#c28bff;font-weight:900}.sub{color:#aaa0b8}h1{margin:8px 0 5px;font-size:32px}label{display:block;margin:17px 0 7px;color:#cfc4da}input{width:100%;padding:14px;border:1px solid #51435f;border-radius:12px;background:#100b1d;color:white;font-size:16px;outline:none}input:focus{border-color:#bd83ff}button{border:0;border-radius:12px;background:linear-gradient(120deg,#9b4de0,#6332a5);color:white;padding:13px 18px;font-weight:800;font-size:15px;margin-top:16px;width:100%;cursor:pointer}.msg{margin-top:14px;color:#ffc37b;overflow-wrap:anywhere}.list{margin-top:20px}.item{padding:14px 0;border-top:1px solid #ffffff18;overflow-wrap:anywhere}.item a{color:#c99aff}.small{font-size:12px;color:#9e92aa}.hidden{display:none}.danger{background:#4c2434;margin-top:8px;padding:9px;width:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{color:#b8ffcc;font-size:12px}
</style></head>
<body><main>
<section class="panel">
<div class="top"><div class="brand">LAMMOD · LINK</div><div class="pill">LINK MANAGER</div></div>
<h1>Tạo liên kết chuyển hướng</h1><div class="sub">Khách mở link sẽ thấy màn hình chờ 6 giây rồi tự chuyển đến website đích.</div>
<div id="login">
<label>Mật khẩu quản trị</label><input id="password" type="password" placeholder="Nhập ADMIN_PASSWORD">
<button onclick="login()">Đăng nhập</button>
</div>
<div id="dashboard" class="hidden">
<label>Website đích</label><input id="target" type="url" placeholder="https://example.com">
<label>Tên link</label><input id="slug" maxlength="30" placeholder="halloween">
<div class="small">Tên link hiển thị dạng <b>halloween.lammod</b>. Đường dẫn truy cập thật sẽ là /r/halloween trên domain Render của bạn.</div>
<button onclick="createLink()">＋ TẠO LINK</button>
<div id="message" class="msg"></div><div class="list" id="links"></div>
</div>
</section><p class="small" style="text-align:center">POWERED BY LAMMOD</p></main>
<script>
let key= "";
const $=id=>document.getElementById(id);
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{"Content-Type":"application/json","x-admin-password":key,...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Có lỗi xảy ra");return d}
async function login(){key=$("password").value;try{await api("/api/links");$("login").classList.add("hidden");$("dashboard").classList.remove("hidden");$("message").textContent="Đăng nhập thành công.";load()}catch(e){$("message").textContent=e.message}}
async function load(){try{const links=await api("/api/links");const entries=Object.entries(links).reverse();$("links").innerHTML="<h3>Liên kết đã tạo ("+entries.length+")</h3>"+(entries.length?entries.map(([slug,v])=>`<div class="item"><b>${escapeHtml(slug)}.lammod</b><br><a target="_blank" rel="noopener" href="/r/${encodeURIComponent(slug)}">${location.origin}/r/${encodeURIComponent(slug)}</a><br><span class="small">${escapeHtml(v.target)}</span><br><button class="danger" onclick="removeLink('${encodeURIComponent(slug)}')">Xóa link</button></div>`).join(""):"<div class='small'>Chưa có liên kết nào.</div>")}catch(e){$("message").textContent=e.message}}
async function createLink(){try{const d=await api("/api/links",{method:"POST",body:JSON.stringify({slug:$("slug").value,target:$("target").value})});$("message").textContent="Đã tạo: "+location.origin+d.path;$("slug").value="";load()}catch(e){$("message").textContent=e.message}}
async function removeLink(s){if(!confirm("Xóa liên kết này?"))return;try{await api("/api/links/"+s,{method:"DELETE"});load()}catch(e){$("message").textContent=e.message}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></body></html>
