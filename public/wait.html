<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b1d"><title>Đang kết nối — LamMOD</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 15%,#49215e,transparent 50%),#100b1d;color:#fff;font-family:system-ui;text-align:center}.box{width:min(90%,480px);padding:35px 24px;background:#1b1426;border:1px solid #ffffff24;border-radius:26px;box-shadow:0 25px 80px #0008}.logo{font-weight:900;letter-spacing:.25em;color:#c58aff;font-size:14px}h1{font-size:clamp(25px,7vw,36px);margin:24px 0 8px}.desc{color:#c2b7ce}.num{font-size:64px;font-weight:900;color:#ffb45d;margin:18px}.track{height:6px;background:#392b48;border-radius:9px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#9d55e8,#ffad57);transition:width 1s linear}.foot{color:#82758f;font-size:11px;margin-top:24px;letter-spacing:.12em}</style></head>
<body><main class="box"><div class="logo">LAMMOD</div><h1>Chờ 1 chút nhé!</h1><div class="desc">Chút tôi đang cố kết nối...</div><div class="num" id="count">6</div><div class="track"><div class="bar" id="bar"></div></div><div class="foot">POWERED BY LAMMOD</div></main>
<script>
(async()=>{const slug=location.pathname.split("/").filter(Boolean).pop();try{const r=await fetch("/api/resolve/"+encodeURIComponent(slug));if(!r.ok)throw Error();const data=await r.json();let n=6;const count=document.getElementById("count"),bar=document.getElementById("bar");const timer=setInterval(()=>{n--;count.textContent=n;bar.style.width=((6-n)/6*100)+"%";if(n<=0){clearInterval(timer);location.replace(data.target)}},1000)}catch(e){document.querySelector("h1").textContent="Không tìm thấy liên kết";document.querySelector(".desc").textContent="Link này không tồn tại hoặc đã bị xóa.";document.getElementById("count").textContent="—"}})();
</script></body></html>
